<!doctype html>
<!-- The DMG's window, 660 by 400: TabTasker | Dictate above, the app on the left and Applications on the right
     (dmgbuild places the icons, scripts/dmg-settings.py), a dashed arc from one to the other, and what to do.
     design/dmg-background.mjs renders it at 1x and 2x into design/dmg-background.tiff. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Source Sans 3'; font-weight: 200 900; src: url('../public/fonts/source-sans-3-normal-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Stack Sans Headline'; font-weight: 200 700; src: url('../public/fonts/stack-sans-headline-400-latin.woff2') format('woff2'); }
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body { position: relative; background: radial-gradient(120% 90% at 30% 0%, #ffffff, #efeeeb 70%); color: #1d1d1f; font-family: 'Source Sans 3', sans-serif; }
  .mark { position: absolute; top: 34px; left: 0; right: 0; text-align: center; font: 600 17px/1 'Stack Sans Headline'; letter-spacing: -.01em; }
  .mark i { font-style: normal; font-weight: 400; color: #8a8a8a; padding: 0 6px; }
  svg { position: absolute; inset: 0; }
  .say { position: absolute; bottom: 68px; /* clear of Finder's path bar, which a person can have on for every window */ left: 0; right: 0; text-align: center; font-size: 14px; font-weight: 500; color: #595959; }
</style>
<p class="mark">TabTasker<i>|</i>Dictate</p>
<svg width="660" height="400" viewBox="0 0 660 400" fill="none" stroke="#1d1d1f" stroke-linecap="round" stroke-linejoin="round">
  <path d="M262 176 C 300 138, 360 138, 398 176" stroke-width="2.5" stroke-dasharray="1 9" opacity=".45" />
  <path d="M386 172 L 400 178 L 397 163" stroke-width="2.5" opacity=".45" />
</svg>
<p class="say">Drag TabTasker Dictate into Applications</p>
