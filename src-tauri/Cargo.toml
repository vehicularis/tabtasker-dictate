[package]
name = "tabtasker-dictate"
version.workspace = true
description = "Hold fn to type with your voice, or take long spoken notes. Whisper runs on your Mac."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dictate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
ring = { workspace = true }
base64 = "0.23"
reqwest = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
# Updates from GitHub releases, signed with the key in tauri.conf.json (app/updates.rs); semver for its version comparison.
# Without its zip feature, which only Windows and Linux installs use.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"
dictate-engine = { path = "../crates/engine" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
