version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # A release has to be 14 days old before it's proposed, as CONTRIBUTING.md asks of every dependency.
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    # A release has to be 14 days old before it's proposed, as CONTRIBUTING.md asks of every dependency.
    cooldown:
      default-days: 14
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release has to be 14 days old before it's proposed, as CONTRIBUTING.md asks of every dependency.
    cooldown:
      default-days: 14
