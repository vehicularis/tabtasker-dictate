name: Bug report
description: Something in Dictate doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Click in a message field in Mail
        2. Hold fn and say a sentence
        3. Let go
  - type: input
    id: version
    attributes:
      label: Dictate version
      description: It's on Dictate's About page.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.5 on a MacBook Air M2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        If you can, paste the lines from around the time it happened, from
        ~/Library/Logs/TabTasker Dictate/dictate.log. Read them first and take out anything private.
      render: text
