name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  app:
    name: macOS app
    # whisper.cpp with Metal and the Objective-C side only build on a Mac.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build the frontend the app embeds
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch sherpa-onnx's libraries again when the cache dropped them
        # sherpa-onnx-sys unpacks its prebuilt static libraries into target/sherpa-onnx-prebuilt, a
        # folder rust-cache leaves out, while the build script's fingerprint is kept. A restored cache
        # whose sherpa-onnx-sys crate needs recompiling (a bumped dependency) then fails to find
        # libsherpa-onnx-c-api.a. With the libraries gone, forget the script ran so it downloads them.
        run: |
          echo "prebuilt, as restored:"; find src-tauri/target/sherpa-onnx-prebuilt -maxdepth 3 2>/dev/null | head -20
          echo "build dirs:"; ls -d src-tauri/target/*/build/sherpa-onnx-sys-* src-tauri/target/*/.fingerprint/sherpa-onnx-sys-* 2>/dev/null
          if ! ls src-tauri/target/sherpa-onnx-prebuilt/*/lib/libsherpa-onnx-c-api.a >/dev/null 2>&1; then
            echo "no libraries: the build script runs again"
            rm -rf src-tauri/target/sherpa-onnx-prebuilt src-tauri/target/*/build/sherpa-onnx-sys-* src-tauri/target/*/.fingerprint/sherpa-onnx-sys-*
          fi
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Where sherpa-onnx's libraries are, after Clippy
        run: |
          find src-tauri/target/sherpa-onnx-prebuilt -maxdepth 3 2>/dev/null | head -20
          for f in src-tauri/target/debug/build/sherpa-onnx-sys-*/output; do echo "== $f"; grep -i 'link-search\|link-lib=static=sherpa-onnx-c-api' "$f"; done
          ls -la src-tauri/target/debug/build | grep sherpa
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
