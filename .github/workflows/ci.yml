name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Mondays: an advisory published since the last push still turns the check red.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first: nothing builds until the dependencies are clear of known vulnerabilities and disallowed licences.
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Known vulnerabilities in the npm packages
        run: npm audit --audit-level=moderate
      - name: Advisories, licences, bans and sources of the Rust crates
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: Cargo.toml
          arguments: ''
          command: check advisories bans licenses sources

  # A pull request that adds or bumps a dependency: its known vulnerabilities and licence, before review.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # glib 0.18 comes only through Tauri's Linux GTK backend; the macOS build never compiles it (Dependabot alert 1).
          allow-ghsas: GHSA-wrw7-89jp-8q8g
          # The licences deny.toml allows, and the ones already among the npm packages.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Zlib, 0BSD, CC0-1.0, MIT-0, Unlicense,
            Unicode-3.0, MPL-2.0, CDLA-Permissive-2.0, bzip2-1.0.6

  web:
    name: Frontend
    needs: [security, dependency-review]
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Skipped checks count as passed, so a failed security check fails this one instead of skipping it.
      - name: Stop if a security check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A security check failed, so nothing builds."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  app:
    name: macOS app
    needs: [security, dependency-review]
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    # whisper.cpp with Metal and the Objective-C side only build on a Mac.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # Skipped checks count as passed, so a failed security check fails this one instead of skipping it.
      - name: Stop if a security check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A security check failed, so nothing builds."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build the frontend the app embeds
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - name: Fetch sherpa-onnx's libraries again when the cache dropped them
        # sherpa-onnx-sys unpacks its prebuilt static libraries into target/sherpa-onnx-prebuilt. rust-cache
        # keeps that folder's directories but not its files, and the build script, seeing a lib directory,
        # doesn't download again; a run that has to recompile sherpa-onnx-sys (a bumped dependency) then
        # fails to find libsherpa-onnx-c-api.a. With no libraries there, the folder goes, and so does the
        # script's fingerprint, so it runs again and downloads them.
        run: |
          if ! ls target/sherpa-onnx-prebuilt/*/lib/libsherpa-onnx-c-api.a >/dev/null 2>&1; then
            rm -rf target/sherpa-onnx-prebuilt target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-*
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Engine tests on their own
        run: cargo test -p dictate-engine --locked
      - name: Engine docs
        run: cargo doc -p dictate-engine --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Engine does not depend on Tauri
        run: "! cargo tree -p dictate-engine -e normal --locked | grep -qi tauri"
