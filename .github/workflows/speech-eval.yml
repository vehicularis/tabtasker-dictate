name: Speech eval

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'src-tauri/src/dictation/**'
      - 'src-tauri/src/meetings/**'
      - '.github/workflows/speech-eval.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'src-tauri/src/dictation/**'
      - 'src-tauri/src/meetings/**'
      - '.github/workflows/speech-eval.yml'
  # Mondays: the same fixtures against the same model, to catch a runner image that changed under them.
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speech-eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Speech eval
    # whisper.cpp with Metal only builds on a Mac. A runner without a GPU falls back to the CPU, which is slower.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - name: Fetch sherpa-onnx's libraries again when the cache dropped them
        # sherpa-onnx-sys unpacks its prebuilt static libraries into target/sherpa-onnx-prebuilt. rust-cache
        # keeps that folder's directories but not its files, and the build script, seeing a lib directory,
        # doesn't download again; a run that has to recompile sherpa-onnx-sys (a bumped dependency) then
        # fails to find libsherpa-onnx-c-api.a. With no libraries there, the folder goes, and so does the
        # script's fingerprint, so it runs again and downloads them.
        run: |
          if ! ls target/sherpa-onnx-prebuilt/*/lib/libsherpa-onnx-c-api.a >/dev/null 2>&1; then
            rm -rf target/sherpa-onnx-prebuilt target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-*
          fi
      - name: Name the speech models
        id: models
        # The key is the SHA-256 lines of models.rs, so a new model downloads once and every other run,
        # whatever else changed in that file, reuses the folder. It names the models fetched below, so
        # fetching another one starts a new folder rather than downloading it on every run.
        run: echo "key=$(grep -E 'sha256:' crates/engine/src/models.rs | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore the speech models
        id: restore-models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/models
          key: speech-models-small-turbo-${{ steps.models.outputs.key }}
      - name: Build the lab
        run: cargo build -p dictate-lab --release --locked
      - name: Fetch the speech models
        run: |
          target/release/dictate-lab fetch --model small
          target/release/dictate-lab fetch --model turbo
      # Saved as soon as they are fetched, so a red eval doesn't download them again next run.
      - name: Save the speech models
        if: steps.restore-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/models
          key: speech-models-small-turbo-${{ steps.models.outputs.key }}
      - name: Render the fixtures
        # A voice the runner lacks skips its fixture; eval says so, and fails if no words were scored at all.
        run: target/release/dictate-lab fixtures
      - name: Score the fixtures on Small
        id: small
        # With --json the table goes to stderr, so one run gives both the scores and the summary.
        run: |
          status=0
          target/release/dictate-lab eval --model small --json > eval-small.json 2> table.txt || status=$?
          { echo '### Small'; echo '```'; cat table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # A skipped fixture measured nothing: a warning each, so a runner without a voice is seen.
          jq -r '.fixtures[] | select(.verdict == "skipped") | "::warning::\(.name) skipped: \(.why)"' eval-small.json || true
          exit "$status"
      - name: Score the fixtures on Turbo
        # The app's default model, scored even when Small fails, so one run says how both do. Its skips
        # are Small's: the same WAVs.
        if: ${{ success() || steps.small.outcome == 'failure' }}
        run: |
          status=0
          target/release/dictate-lab eval --model turbo --json > eval-turbo.json 2> table.txt || status=$?
          { echo '### Turbo'; echo '```'; cat table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the scores
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speech-eval-${{ github.run_id }}
          path: eval-*.json
          if-no-files-found: ignore
